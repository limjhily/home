<style>

body{

a{color:var(--accent)}
.wrap{max-width:940px; margin:0 auto; padding:0 16px}
.num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace; font-variant-numeric:tabular-nums}

header{background:var(--navy); color:#EEF3FB; border-bottom:1px solid var(--line)}

.hd{display:flex; align-items:baseline; gap:12px; padding:18px 0 16px; flex-wrap:wrap}
.logo{font-family:"Noto Serif KR",serif; font-weight:700; font-size:22px; letter-spacing:-.02em; color:inherit}
.logo b{color:#8FB4F5}
.tag{font-size:12.5px; color:#A9BCDC; letter-spacing:.02em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--ink-3)}}
:root[data-theme="dark"] .tag{color:var(--ink-3)}
.hd .spacer{flex:1}
.themebtn{background:transparent; border:1px solid rgba(255,255,255,.28); color:inherit; border-radius:99px;
  font:inherit; font-size:12.5px; padding:4px 12px; cursor:pointer}
.themebtn:hover{border-color:rgba(255,255,255,.6)}

/* ── 광고 ── */
.ad{border:1px dashed var(--line-2); border-radius:var(--r); background:var(--surface-2);
  color:var(--ink-3); font-size:12px; letter-spacing:.06em; text-align:center;
  display:flex; align-items:center; justify-content:center}
.ad-top{height:90px; margin:16px 0}
.ad-infeed{height:110px; margin:6px 0 14px}

/* ── 필터 ── */
.filters{position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 0 8px}
.frow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.frow + .frow{margin-top:8px}
.flabel{font-size:11.5px; color:var(--ink-3); letter-spacing:.08em; min-width:38px}
.chip{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  border-radius:99px; font:inherit; font-size:13px; padding:4px 12px; cursor:pointer; white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0E1219}
.search{flex:1; min-width:150px; border:1px solid var(--line-2); background:var(--surface);
  color:var(--ink); border-radius:99px; font:inherit; font-size:13.5px; padding:5px 14px}
.search::placeholder{color:var(--ink-3)}
.count{font-size:12.5px; color:var(--ink-3); padding:8px 0 0}

.day:first-of-type{border-top:none}
.daymark{position:sticky; top:96px; align-self:start; padding-top:2px}
.dnum{font-family:"Noto Serif KR",serif; font-weight:700; font-size:26px; line-height:1; letter-spacing:-.03em}
.dmon{font-size:12px; color:var(--ink-3); margin-top:3px}
.dday{font-size:11.5px; color:var(--ink-3)}
.drel{display:inline-block; margin-top:6px; font-size:11px; padding:1px 7px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent)}
.dpast .dnum,.dpast .dmon{color:var(--ink-3)}

.cards{display:flex; flex-direction:column; gap:10px}

/* ── 카드 ── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card.open{border-color:var(--line-2)}
.chead{width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit;
  padding:13px 14px; cursor:pointer; display:block; border-radius:var(--r)}
.chead:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ctop{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.cname{font-weight:600; font-size:16px; letter-spacing:-.01em; flex:1; min-width:0}
.st{font-size:11.5px; padding:2px 9px; border-radius:99px; font-weight:500; white-space:nowrap}
.st-open{background:var(--ok-bg); color:var(--ok)}
.st-soon{background:var(--warn-bg); color:var(--warn)}
.st-done{background:var(--off-bg); color:var(--off)}
.cmeta{color:var(--ink-2); font-size:13px; margin-top:3px}
.cmeta .sep{color:var(--line-2); margin:0 6px}
.cstat{display:flex; gap:18px; margin-top:9px; flex-wrap:wrap}
.cstat div{font-size:12px; color:var(--ink-3)}
.cstat strong{display:block; font-size:14.5px; color:var(--ink); font-weight:600;
  font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.flags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.flag{font-size:11.5px; padding:2px 8px; border-radius:5px; border:1px solid var(--line);

.flag.no{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 30%, var(--line)); background:var(--ok-bg)}
.flag.yes{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 30%, var(--line)); background:var(--warn-bg)}

/* ── 상세 ── */
.body{border-top:1px solid var(--line); padding:14px}
.sechd{font-size:11.5px; letter-spacing:.1em; color:var(--ink-3); margin:0 0 7px}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:400px}

.notes{margin:16px 0 0; padding:0; list-style:none; font-size:13px; color:var(--ink-2)}

footer{margin:28px 0 0; padding:16px 0 40px; border-top:1px solid var(--line);

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  total:672, general:344, builder:"대우건설", zone:"비규제지역",
  special:"2026-10-05", first:"2026-10-06", second:"2026-10-07", result:"2026-10-14", contract:"2026-11-02 ~ 11-04",
  resale:6, live:0, link:"https://www.applyhome.co.kr",
  units:[{t:"59A", area:59.88, n:186, price:37600},{t:"84A", area:84.92, n:396, price:49300},
         {t:"101A", area:101.55, n:90, price:60100}],
  notes:["공고 예정 · 일정은 변경될 수 있음"]}
];

const LINKS = [
 {t:"청약홈", d:"한국부동산원 · 민영/국민주택 청약 접수", u:"https://www.applyhome.co.kr"},
 {t:"LH 청약플러스", d:"공공분양·공공임대 접수", u:"https://apply.lh.or.kr"},
 {t:"SH 서울주택도시공사", d:"서울시 공공주택 공급", u:"https://www.i-sh.co.kr"},
 {t:"경기주택도시공사 GH", d:"경기도 공공분양·임대", u:"https://www.gh.or.kr"},
 {t:"마이홈 포털", d:"주거복지 · 자격 자가진단", u:"https://www.myhome.go.kr"},
 {t:"부동산공시가격 알리미", d:"공시가격 조회(자산요건 확인)", u:"https://www.realtyprice.kr"},
 {t:"실거래가 공개시스템", d:"주변 시세 비교", u:"https://rt.molit.go.kr"},
 {t:"주택도시기금 기금e든든", d:"디딤돌·버팀목 대출 신청", u:"https://enhuf.molit.go.kr"}
];

let NOTICES = SAMPLE, LIVE = false;

/* ── 렌더링 ── */
const TODAY = new Date(new Date().toISOString().slice(0,10));
const DOW = ["일","월","화","수","목","금","토"];
const won = v => v >= 10000 ? (v/10000).toFixed(1).replace(/\.0$/,"") + "억" : v.toLocaleString() + "만";
const d = s => new Date(s);

function status(n){
  const end = d(n.second), start = d(n.special);
  if (TODAY > d(n.contract.slice(0,10))) return ["종료","st-done"];
  if (TODAY > end) return ["발표 대기","st-done"];
  if (TODAY >= start) return ["접수중","st-open"];
  const days = Math.round((start - TODAY)/864e5);
  return [days <= 7 ? "D-"+days : "예정", days <= 7 ? "st-open" : "st-soon"];
}
const priceRange = n => {
  const p = n.units.map(u=>u.price);
  return won(Math.min(...p)) + " ~ " + won(Math.max(...p));
};

const state = {region:"전체", type:"전체", q:"", past:false};
const types = ["전체","민영","공공"];

function chips(el, list, key){
  el.innerHTML = "";
  list.forEach(v=>{
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = v;
    b.setAttribute("aria-pressed", state[key] === v);
    b.onclick = () => { state[key] = v; chips(el, list, key); render(); };
    el.appendChild(b);
  });
}

function render(){
  const q = state.q.trim();
  const closed = n => d(n.second || n.first || n.special) < TODAY;
  const hidden = NOTICES.filter(closed).length;
  const rows = NOTICES.filter(n =>
    (state.past || !closed(n)) &&
    (state.region === "전체" || n.region === state.region) &&
    (state.type === "전체" || n.type === state.type) &&
    (!q || (n.name + n.region + n.district + n.builder).includes(q))
  ).sort((a,b) => d(a.special) - d(b.special));

  const info = document.getElementById("count");
  info.textContent = rows.length ? `단지 ${rows.length}곳 · 특별공급일 순` : "";
  const btn = document.getElementById("pastbtn");
  if (hidden){
    btn.hidden = false;
    btn.textContent = state.past ? "지난 공고 숨기기" : `지난 공고 ${hidden}건 보기`;
    btn.setAttribute("aria-pressed", state.past);
  } else btn.hidden = true;

  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!rows.length){ list.innerHTML = '<p class="empty">조건에 맞는 청약 단지가 없습니다.</p>'; return; }

  let cur = "", box = null, idx = 0;
  rows.forEach(n => {
    if (n.special !== cur){
      cur = n.special;
      const dt = d(cur), past = dt < TODAY;
      const diff = Math.round((dt - TODAY)/864e5);
      const day = document.createElement("section");
      day.className = "day" + (past ? " dpast" : "");
      day.innerHTML = `<div class="daymark">
          <div><div class="dnum num">${dt.getDate()}</div>
          <div class="dmon">${dt.getMonth()+1}월 · ${DOW[dt.getDay()]}</div></div>
          ${diff === 0 ? '<span class="drel">오늘</span>' :
            diff > 0 && diff <= 14 ? `<span class="drel">D-${diff}</span>` : ""}
        </div><div class="cards"></div>`;
      list.appendChild(day);
      box = day.querySelector(".cards");
    }
    box.appendChild(card(n));
    if (++idx === 3){
      const ad = document.createElement("div");
      ad.className = "ad ad-infeed"; ad.textContent = "인피드 광고 영역";
      box.appendChild(ad);
    }
  });
}

const typeName = u => {
  const m = String(u.t || "").match(/([A-Za-z]+)\s*$/);
  const suffix = m ? m[1].toUpperCase() : "";
  return u.area ? Math.round(u.area) + suffix : (u.t || "-");
};
const unk = v => v === null || v === undefined;
const txt_resale = n => unk(n.resale) ? "확인 필요" : n.resale === 0 ? "없음" : n.resale + "개월";
const txt_live   = n => unk(n.live)   ? "확인 필요" : n.live === 0 ? "없음" : n.live + "년";
const cls_resale = n => unk(n.resale) ? "" : n.resale <= 12 ? "no" : "yes";
const cls_live   = n => unk(n.live)   ? "" : n.live ? "yes" : "no";

function card(n){
  const [label, cls] = status(n);
  const jeonse = (n.live === null || n.live === undefined) ? null : n.live === 0;
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `
    <button class="chead" type="button" aria-expanded="false">
      <span class="ctop">
        <span class="cname">${n.name}</span>
        <span class="st ${cls}">${label}</span>
      </span>
      <div class="cmeta">${n.region} ${n.district}<span class="sep">|</span>${n.type}<span class="sep">|</span>${n.zone}</div>
      <div class="cstat">
        <div>총 세대<strong>${n.total.toLocaleString()}</strong></div>
        <div>일반공급<strong>${n.general.toLocaleString()}</strong></div>
        <div>분양가<strong>${priceRange(n)}</strong></div>
        <div>전용면적<strong>${Math.min(...n.units.map(u=>u.area)).toFixed(0)}~${Math.max(...n.units.map(u=>u.area)).toFixed(0)}㎡</strong></div>
      </div>
      <div class="flags">
        <span class="flag ${cls_resale(n)}">전매제한 ${txt_resale(n)}</span>
        <span class="flag ${cls_live(n)}">실거주의무 ${txt_live(n)}</span>
        <span class="flag ${jeonse === null ? "" : jeonse ? "no" : "yes"}">전세 ${jeonse === null ? "확인 필요" : jeonse ? "가능" : "불가"}</span>
      </div>
    </button>`;

  const btn = el.querySelector(".chead");
  btn.onclick = () => {
    const open = el.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
    if (open) el.appendChild(detail(n, jeonse));
    else el.querySelector(".body").remove();
  };
  return el;
}

function detail(n, jeonse){
  const b = document.createElement("div");
  b.className = "body";
  b.innerHTML = `
    <p class="sechd">평형별 공급 · 분양가(최고가 기준)</p>
    <div class="tblwrap"><table>
      <thead><tr><th>타입</th><th>전용면적</th><th>총 세대</th><th>일반공급</th><th>분양가</th><th>3.3㎡당</th></tr></thead>
      <tbody>${n.units.map(u=>`<tr>
        <td class="hi">${typeName(u)}</td>
        <td class="n">${u.area.toFixed(2)}㎡</td>
        <td class="n">${u.n.toLocaleString()}</td>
        <td class="n">${u.gen === undefined ? "-" : u.gen.toLocaleString()}</td>
        <td class="n hi">${won(u.price)}</td>
        <td class="n">${Math.round(u.price / (u.area/3.3058)).toLocaleString()}만</td>
      </tr>`).join("")}</tbody>
    </table></div>

    <p class="sechd" style="margin-top:16px">청약 일정</p>
    <dl class="sched">
      <div><dt>특별공급</dt><dd>${n.special.slice(5)}</dd></div>
      <div><dt>1순위</dt><dd>${n.first.slice(5)}</dd></div>
      <div><dt>2순위</dt><dd>${n.second.slice(5)}</dd></div>
      <div><dt>당첨자 발표</dt><dd>${n.result.slice(5)}</dd></div>
      <div><dt>계약</dt><dd>${n.contract.slice(5)}</dd></div>
    </dl>

    <ul class="notes">
      ${n.builder ? `<li>시공사 ${n.builder} · ${n.zone}</li>` : `<li>${n.zone}</li>`}
      <li>전매제한 ${txt_resale(n)} · 실거주의무 ${txt_live(n)}
          → 입주 후 <b>전세 ${jeonse === null ? "여부는 공고문 확인" : jeonse ? "놓을 수 있음" : "놓을 수 없음"}</b>
          ${unk(n.resale) && unk(n.live) ? "" : "<br><span style='color:var(--ink-3)'>이 두 항목은 공고문에서 자동으로 읽은 값입니다. 계약 전 원문을 확인하세요.</span>"}</li>
      ${n.notes.map(t=>`<li>${t}</li>`).join("")}
    </ul>
    <a class="golink" href="${n.link}" target="_blank" rel="noopener">공고문 보러 가기 →</a>`;
  return b;
}

document.getElementById("links").innerHTML = LINKS.map(l =>
  `<a href="${l.u}" target="_blank" rel="noopener"><strong>${l.t}</strong><span>${l.d}</span></a>`).join("");

function init(){
  const regions = ["전체", ...new Set(NOTICES.map(n=>n.region))];
  chips(document.getElementById("f-region"), regions, "region");
  chips(document.getElementById("f-type"), types, "type");
  document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
  document.getElementById("pastbtn").onclick = () => { state.past = !state.past; render(); };
  const banner = document.getElementById("sample");
  if (LIVE) banner.remove();
  render();
}

/* data/notices.json 이 있으면 그걸 쓰고, 없으면 파일 안의 샘플을 쓴다 */
(async () => {
  try{
    const res = await fetch("data/notices.json", {cache:"no-store"});
    if (res.ok){
      const json = await res.json();
      if (Array.isArray(json.items) && json.items.length){
        NOTICES = json.items; LIVE = true;
        const u = document.getElementById("updated");
        if (json.updated) u.textContent = "데이터 기준 " + json.updated;
      }
    }
  }catch(e){ /* 로컬 파일로 열었을 때 등 - 샘플로 진행 */ }
  init();
})();

document.getElementById("tbtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
};
</script>
