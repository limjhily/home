name: 청약 데이터 수집

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:        # 수동 실행 버튼
  push:
    branches: [main]
    # 수집 로직이나 수동 보정값이 바뀌면 데이터를 다시 만든다.
    # 이 워크플로가 커밋하는 파일(data/notices.json, data/pdf_cache.json)은
    # 아래 목록에 없으므로 자기 자신을 다시 트리거하지 않는다.
    paths:
      - "scripts/**"
      - "data/overrides.json"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install --quiet pdfplumber

      - name: 수집 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/collect.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/pdf_cache.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 청약 데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
